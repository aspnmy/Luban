[package]
name = "luban-api"
version = "0.2.3"
edition = "2021"
license = "Apache-2.0"
description = "Image compression API service — Rust port of Luban's compression algorithm"
repository = "http://10.168.3.165:3000/aspnmy/Luban"

[[bin]]
name = "luban-api"
path = "src/main.rs"

[dependencies]
# HTTP 服务：axum 0.7 的 Json extractor 默认 2MB body 上限，
# 必须显式用 DefaultBodyLimit 放宽（图片动辄 5-20MB）。
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 图像解码/编码
#   image 0.25 自带 jpeg/png/webp 编解码，质量可控（JpegEncoder::new_with_quality）
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "webp", "bmp", "gif", "tiff",
] }

# EXIF 方向读取（Luban 原实现按 Orientation 转正后再压）
kamadak-exif = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
